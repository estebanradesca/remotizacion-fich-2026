<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- 
        Agregar favicon después
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Experimento de Reynolds</title>

        <!-- CSS -->
        <!--No es necesario, Vite lo importa directamente

        <link rel="stylesheet" href="src/style.css"/> 
        
        -->
        <!-- Fuente Lato-->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
   
    </head>
    <body>
    <!-- Encabezado -->
        <header>
            <h1 class="titulo">Experimento de Reynolds</h1>
        </header>

        <main>             
            <div id="cont-general">
                <div id="cont-camara">
                    <h4>Cámara</h4>
                    <div id="cont-video-controles">
                        <div class="cont-video">
                            <video id="video-stream" autoplay playsinline muted></video>
                        </div>

                        <div id="cont-zoom">
                            <button id="bot-dis-zoom">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="6"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    <line x1="8" y1="11" x2="14" y2="11"></line>
                                </svg>
                            </button>
                            <button id="bot-aum-zoom">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="6"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    <line x1="8" y1="11" x2="14" y2="11"></line>
                                    <line x1="11" y1="8" x2="11" y2="14"></line>
                                </svg>
                            </button>
                        </div>
                        <div id="cont-captura">
                            <button id="bot-captura">Guardar</button>
                        </div>
                    </div>
                </div>

                <div id="cont-controles">
                    <h4>Datos de control</h4>
                    <div id="cont-manejo-controles">

                    <div class="cont-reg-tinta">
                        <span>Tinta</span>
                        <div id="cont-regulador">
                            <button id="bot-dis-pasos-tinta">-</button>
                            <input type="range" id="desl-pasos-tinta" min="0" max="50" step="1" value="0">
                            <button id="bot-aum-pasos-tinta">+</button>
                        </div>
                    </div>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  

                    <div id="cont-reg-agua">
                        <span>Agua</span>
                        <div id="cont-regulador">
                            <button id="bot-dis-pasos-agua">-</button>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                            <input type="range" id="desl-pasos-agua" min="0" max="600" step="1" value="0">
                            <button id="bot-aum-pasos-agua">+</button>
                        </div>
                    </div>

                    
                    <div><span>Caudal</span><strong><span id="valor-caudal">Sin datos</span> L/s</strong></div>
                    <div><span>Temperatura</span><strong><span id="valor-temp">Sin datos</span> °C</strong></div>
                    <div><span>Diámetro</span><strong>25 mm</strong></div>
                    <div><span>Viscocidad</span><strong>0.1 Pa⋅s</strong></div>

                    </div>

                    <div id="cont-terminal">
                    </div>
                    <div id="deposito"><span>Depósito de agua</span>
                        <button id="bot-rele" class="apagado">A</button> 
                    </div>
                </div>
            </div>            
            
                    
        </main>
        
        <!-- Pie de página -->
        <footer>
            <p>© 2026 FICH | UNIVERSIDAD NACIONAL DEL LITORAL</p>
        </footer>

        <!-- JS -->
        <script type="module" src="./reynolds.js" defer></script>
    </body>
</html>
